packages:
  - "apps/*"
  - "packages/*"

# Packages allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# pnpm delays installing brand-new releases (supply-chain safety). These exact
# versions were newer than that window when added; later versions still wait.
minimumReleaseAgeExclude:
  - "@supabase/cli-darwin-arm64@2.118.0"
  - "@supabase/cli-darwin-x64@2.118.0"
  - "@supabase/cli-linux-arm64-musl@2.118.0"
  - "@supabase/cli-linux-arm64@2.118.0"
  - "@supabase/cli-linux-x64-musl@2.118.0"
  - "@supabase/cli-linux-x64@2.118.0"
  - "@supabase/cli-windows-arm64@2.118.0"
  - "@supabase/cli-windows-x64@2.118.0"
  - supabase@2.118.0
  - dotenv@18.0.4
  - "@supabase/auth-js@2.117.2"
  - "@supabase/functions-js@2.117.2"
  - "@supabase/postgrest-js@2.117.2"
  - "@supabase/realtime-js@2.117.2"
  - "@supabase/storage-js@2.117.2"
  - "@supabase/supabase-js@2.117.2"
